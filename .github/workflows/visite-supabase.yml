# RSG — visite automatique de la base Supabase tous les 3 jours,
# pour qu'elle ne soit jamais mise en pause (offre gratuite : pause après 7 jours sans activité).
name: Visite automatique de la base RSG

on:
  schedule:
    - cron: "17 6 */3 * *"   # les 1, 4, 7, 10, 13, 16, 19, 22, 25, 28 et 31 du mois, vers 7h (heure de Paris) : jamais plus de 3 jours d'écart
  workflow_dispatch:          # bouton « Run workflow » pour lancer une visite à la main

permissions:
  contents: write

jobs:
  visite:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger la base Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Il manque les secrets SUPABASE_URL et SUPABASE_KEY (Settings > Secrets and variables > Actions)."; exit 1
          fi
          # On ne garde que le début de l'adresse (https://xxxx.supabase.co), même si un morceau en trop a été collé.
          BASE=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]' | grep -oE 'https://[a-z0-9-]+\.supabase\.(co|in)' | head -n 1)
          if [ -z "$BASE" ]; then
            echo "Le secret SUPABASE_URL doit contenir l'adresse du projet, du type https://xxxx.supabase.co"; exit 1
          fi
          KEY=$(printf '%s' "$SUPABASE_KEY" | tr -d '[:space:]')
          code=$(curl -s -o reponse.txt -w "%{http_code}" "$BASE/rest/v1/docs?select=id&limit=1" -H "apikey: $KEY")
          echo "Réponse de la base : $code"
          cat reponse.txt; echo
          # 200 : la base a répondu. 401 avec « permission denied » (42501) : la base a bien été interrogée,
          # elle refuse seulement de montrer les données sans connexion : c'est normal et sans danger.
          if [ "$code" = "200" ] || grep -q '"42501"' reponse.txt; then
            echo "Visite réussie : la base RSG est active."
          elif grep -qi "api key" reponse.txt; then
            echo "La clé SUPABASE_KEY n'est pas acceptée : recopiez la clé publishable (sb_publishable_...) dans le secret."; exit 1
          else
            echo "La base ne répond pas normalement : elle est peut-être en pause (Supabase > projet RSG > Resume project)."; exit 1
          fi

      # Une petite trace dans le dépôt : elle garde aussi la visite active côté GitHub
      # (GitHub arrête les tâches planifiées d'un dépôt sans activité pendant 60 jours).
      - uses: actions/checkout@v4
      - name: Noter la date de la visite
        run: |
          date -u +"Dernière visite automatique de la base RSG : %d/%m/%Y %H:%M (UTC)" > derniere-visite.txt
          git config user.name "RSG visite automatique"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derniere-visite.txt
          git commit -m "Visite automatique de la base RSG" || exit 0
          git push
